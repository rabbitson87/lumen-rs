[package]
name = "paged-attention"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "vLLM-style PagedAttention for Metal GPU — block allocator, page table, scheduler"

[dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-metal-kernels = { workspace = true }
objc2-metal = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
half = "2.7.1"

[features]
# Opt-in for legacy integration tests that drifted out of sync with the
# current candle-metal-kernels API. Disabled by default until the call
# sites are repaired.
legacy-tests = []

[[example]]
name = "paged_decode_bench"
path = "examples/paged_decode_bench.rs"
required-features = ["legacy-tests"]

[[test]]
name = "kernel_tests"
required-features = ["legacy-tests"]
