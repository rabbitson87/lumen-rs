[package]
name = "lumen-mlx"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# Vision input decoding for the Gemma 4 image tower (PNG/JPEG/WebP in,
# bicubic resize onto the patch grid). No encoder side is needed here.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
tokenizers = "0.23.1"
hf-hub = "0.5.0"
# Phase 2 — grammar-constrained tool calling. JSON Schema → token mask
# converter used by Gemma 4 lazy-trigger tool calling (mirrors
# llama.cpp's peg-gemma4 lazy GBNF mechanism). Optional `jsonschema`
# feature pulls in ~2.5 MB of validation code — kept ON because we
# accept arbitrary tool argument schemas from OpenAI-spec clients.
# Pure Rust, no native deps.
llguidance = { version = "1.7", features = ["jsonschema_validation"] }
# Jinja2-compatible template interpreter. Replaces the hand-ported Rust
# render logic in `gemma4_chat.rs` with direct evaluation of the model's
# upstream `chat_template.jinja`, guaranteeing byte-identical parity with
# `transformers.AutoTokenizer.apply_chat_template` and removing the
# maintenance burden of mirroring jinja semantics in Rust. Pure Rust,
# ~250 KB, no native deps.
minijinja = { version = "2.13", default-features = false, features = [
    "builtins",
    "macros",
    "loop_controls",
    "preserve_order",
    "json",
    "serde",
] }
# Python-compat handler for `.get()`, `.split()`, `.startswith()`, etc.
# The upstream chat_template.jinja files emit Python idioms that vanilla
# Jinja2 supports because Python is the host language; minijinja, being
# Rust-native, needs this companion crate to register a fallback method
# resolver. Pure Rust, ~70 KB.
minijinja-contrib = { version = "2.13", features = ["pycompat"] }
# TurboQuant primitives — Haar rotation matrix generator for KV pre-quant
# Gaussianization. Pulled into lumen-mlx for the K-rotation lever in the
# sliding quantized cache (LUMEN_GEMMA4_QUANT_KV_SLIDING_ROTATE=1).
lumen-core = { path = "../lumen-core" }
# Native MLX runner scaffold. This stays opt-in (off by default; gate
# via `--features mlx-native`) because the dependency tree includes a
# patched mlx-rs / mlx-sys fork with our Kestrel custom primitives
# (`kestrel_flash_attn_bf16`), MXFP4 `mode` parameter, and the
# `memory` / `metal` modules used by direct kernel dispatch.
#
# Pinned to the `lumen-rs-patches` branch of rabbitson87/mlx-rs (single
# squashed commit on top of upstream's mlx-rs main). Local devs can
# override to a sibling `../../../mlx-rs` checkout via the workspace
# `[patch]` section in the top-level Cargo.toml.
mlx-rs = { git = "https://github.com/rabbitson87/mlx-rs", rev = "f8cfdd8830d675ae7bbe5fbfb78ea6ea4478278c", optional = true, default-features = false, features = [
    "accelerate",
] }
mlx-sys = { git = "https://github.com/rabbitson87/mlx-rs", rev = "f8cfdd8830d675ae7bbe5fbfb78ea6ea4478278c", optional = true }

# Phase 1.8 M1.5 — direct Metal kernel dispatch against mlx-allocated buffers.
# Uses objc2 + objc2-metal for raw MTLDevice / MTLCommandQueue / pipeline
# compilation. Lighter than pulling all of lumen-metal (which depends
# on candle); proves the round-trip Array → MTL::Buffer → kernel → MTL::Buffer
# → Array works end-to-end before committing to a heavier dep graph for M2+.
objc2 = { version = "0.6.4", optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
# PyO3 — in-process Python interpreter for the mlx-lm Pyo3Runner (Qwen
# backend only). Gemma 4 native path is pure Rust + mlx-rs. Gate behind
# the `mlx-pyo3` feature so production builds (Gemma 4) can be PyO3-free
# and ship a Python.framework-independent binary.
pyo3 = { version = "0.28.3", features = ["auto-initialize"], optional = true }

[features]
default = []
mlx-pyo3 = ["dep:pyo3"]
mlx-native = [
    "dep:mlx-rs",
    "dep:mlx-sys",
    "mlx-rs/safetensors",
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-foundation",
]
mlx-native-metal = ["mlx-native", "mlx-rs/metal"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tempfile = "3.10"

# ── Examples that cannot build under `default = []` ───────────────────────────
#
# Most examples here handle the featureless build themselves, with a
# `#[cfg(feature = "mlx-native")] fn main()` and a stub for the other side.
# These twelve name `mlx_rs` types (or `lumen_mlx` re-exports that are gated on
# it) at module scope, where a `cfg` on `main` cannot help. Per
# `docs/maintainer-workflow.md` §6 they declare the feature instead, so a plain
# `cargo test -p lumen-mlx` skips them rather than failing to compile.
#
# Without these entries the crate's own default configuration does not build,
# which is how `qwen3_5_mtp` silently lost its feature gate: nothing ever ran
# the build that would have caught it.
[[example]]
name = "bench_affine4_qmv_decode"
required-features = ["mlx-native"]

[[example]]
name = "bench_mtp_headinternal_poc"
required-features = ["mlx-native"]

[[example]]
name = "bench_mtp_ref_compare"
required-features = ["mlx-native"]

[[example]]
name = "bench_qwen35_mtp_ab"
required-features = ["mlx-native"]

[[example]]
name = "bench_qwen35_mtp_decode_smoke"
required-features = ["mlx-native"]

[[example]]
name = "bench_qwen35_mtp_loader_smoke"
required-features = ["mlx-native"]

[[example]]
name = "bench_qwen35_mtp_realprompt"
required-features = ["mlx-native"]

[[example]]
name = "bench_qwen35_mtp_step_b"
required-features = ["mlx-native"]

[[example]]
name = "m1_affine4_qmv_custom"
required-features = ["mlx-native"]

[[example]]
name = "m2a_conv_silu_fused"
required-features = ["mlx-native"]

[[example]]
name = "m2b_qk_rmsnorm_fused"
required-features = ["mlx-native"]

[[example]]
name = "m2c_inproj_tail_fused"
required-features = ["mlx-native"]

[[example]]
name = "kv_concurrency_ab"
required-features = ["mlx-native"]

[[example]]
name = "prefill_chunk_equivalence"
required-features = ["mlx-native"]
