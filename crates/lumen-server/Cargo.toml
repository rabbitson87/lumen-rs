[package]
name = "lumen-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenAI-compatible HTTP server for TurboQuant LLM inference"

[dependencies]
lumen-core = { workspace = true }
turboquant-cache = { workspace = true }
lumen-mlx = { path = "../lumen-mlx" }
# Native FLUX.2-dev text-to-image backend. Optional — pulled in only when the
# server's `mlx-native` feature is on (gates the heavy mlx-sys fork + ~30 GB
# diffusion models). The `DiffusionHandle` channel type is always compiled; the
# actual `DiffusionService` worker is `#[cfg(feature = "mlx-native")]`.
lumen-diffusion = { path = "../lumen-diffusion", optional = true }
# base64 for the `/v1/images/generations` b64_json response payload.
base64 = "0.22"

atomic_http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# .env auto-load. Read at server startup so callers can drop a `.env`
# file next to the binary (or in CWD) instead of exporting every var.
dotenvy = "0.15.7"

[features]
# MLX is the only backend. `mlx-native` also pulls in the native FLUX.2-dev
# diffusion backend (text-to-image) with its Metal feature, so `image`/`hybrid`
# serve modes can generate images on the GPU. mlx-rs/metal is additive — it
# unifies with lumen-mlx's mlx-rs build.
#
# The Candle features that used to live here (`turboquant-gpu`, `mpsgraph`,
# `legacy-candle`, `qwen3_5_moe`, `turboquant`) went with the Candle backend.
default = ["mlx-native"]
mlx-native = [
    "lumen-mlx/mlx-native",
    "dep:lumen-diffusion",
    "lumen-diffusion/mlx-native-metal",
]
