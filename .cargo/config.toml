# Workspace-level cargo config. PyO3 needs to know which Python to link against;
# without this, pyo3-build-config falls back to whatever `python3` resolves to on
# the host (often Homebrew's `python@3.14`, which may not actually be installed),
# breaking the build for the `lumen-mlx` crate.
#
# Override locally by setting `PYO3_PYTHON` in your shell before running cargo.
[env]
PYO3_PYTHON = { value = ".venv/bin/python", relative = true }
