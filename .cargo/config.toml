# Workspace-level cargo config.
[env]
# fastokens (vendored, a lumen-mlx dependency) links PCRE2 through
# pcre2-sys, which prefers any libpcre2 pkg-config can find — Homebrew's, on a
# typical Mac — over its vendored copy. Static keeps binaries self-contained
# and the regex Unicode tables identical on every machine, which a parity
# measurement depends on.
PCRE2_SYS_STATIC = "1"

# `cargo xtask …` runs the workspace task runner. Kept out of `default-members`
# so it never slows down a plain `cargo build` at the root.
[alias]
xtask = "run --quiet --package xtask --"
